{% from "macro-jsoneditor-field.html" import jsoneditor_field %}
<form
        data-signals="{updating: false}"
        data-on:datastar-fetch="evt.detail.type === 'error' && ($updating = false)"
>
    {{ form.request_id() }}
    {{ jsoneditor_field(form.name) }}

    <div class="row mb-3">
        <div class="col-sm-10 offset-sm-2">
            <a
                    href="{{ url_for('workflow_stages:list') }}"
                    class="btn btn-outline-secondary"
                    aria-label="cancel-update"
            >{{ _('cancel') | capitalize }}
            </a>
            <button
                    type="submit"
                    aria-label="submit-update-form"
                    class="btn btn-primary"
                    data-on:click="$updating = true; @put('{{ url_for('workflow_stages:detail', resource_id=item.id) }}', {
                            contentType: 'form',
                            headers: {'X-CSRFToken': '{{ form.csrf_token.current_token }}'}
                        })"
                    data-attr:disabled="$updating"
            >
                <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"
                      data-attr:hidden="!$updating"></span>
                <span data-text="$updating ? '{{ _('updating workflow stage...') | capitalize }}' : '{{ _('update workflow stage') | capitalize }}'"></span>
            </button>
        </div>
    </div>
</form>
