{% from "macro-jsoneditor-field.html" import jsoneditor_field %}
<form
        data-signals="{submitting: false}"
        data-on:datastar-fetch="evt.detail.type === 'error' && ($submitting = false)"
>
    {{ form.request_id() }}
    {{ jsoneditor_field(form.name) }}
    <output></output>
    <div class="row mb-3">
        <div class="col-sm-10 offset-sm-2">
            <a
                    href="{{ url_for('dataset_categories:list') }}"
                    class="btn btn-outline-secondary"
                    aria-label="cancel-creation"
            >{{ _('cancel') | capitalize }}
            </a>
            <button
                    type="submit"
                    aria-label="submit-create-form"
                    class="btn btn-primary"
                    data-on:click="$submitting = true; @post('{{ url_for('dataset_categories:list') }}', {
                            contentType: 'form',
                            headers: {'X-CSRFToken': '{{ form.csrf_token.current_token }}'}
                        })"
                    data-attr:disabled="$submitting"
            >
                <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"
                      data-attr:hidden="!$submitting"></span>
                <span data-text="$submitting ? '{{ _('Creating dataset category...') }}' : '{{ _('Create dataset category') }}'"></span>
            </button>
        </div>
    </div>
</form>
