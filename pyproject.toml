[project]
dynamic = [
    "version"
]
name = "seis-lab-data"
description = "marine data catalog"
readme = "README.md"
authors = [
    { name = "Ricardo Garcia Silva", email = "ricardo.garcia@naturalgis.pt" }
]
# we are deploying in a docker container derived from gdal:ubuntu-small, which
# is based on ubuntu:24.04 and thus has python 3.12
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16.4",
    "alembic-postgresql-enum>=1.8.0",
    "anyio>=4.9.0",
    "authlib>=1.6.1",
    "datastar-py>=0.6.5",
    "dramatiq[redis,watch]>=1.18.0",
    "faker>=38.0.0",
    "fastapi>=0.141.1",
    "geoalchemy2>=0.18.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.2.9",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "pygments>=2.19.2",
    "python-multipart>=0.0.20",
    "redis[hiredis]>=6.2.0",
    "rich>=14.0.0",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.43",
    "sqlmodel>=0.0.24",
    "stac-pydantic>=3.6.0",
    "starlette>=0.47.1",
    "starlette-babel>=1.0.3",
    "starlette-wtf>=0.4.5",
    "typer>=0.16.0",
    "uvicorn[standard]>=0.35.0",
]
[project.scripts]
seis-lab-data = "seis_lab_data.cliapp.main:app"

[dependency-groups]
dev = [
    "playwright>=1.53.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-playwright>=0.7.0",
    "ruff>=0.12.1",
    "ty>=0.0.1a21",
]
jupyter = [
    "jupyterlab>=4.4.4",
]
gdal = [
    "gdal==3.11.4",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocs-static-i18n>=1.3.0",
    "mkdocs-to-pdf>=0.10.1",
]

[tool.uv]
default-groups = []
package = true

[tool.pytest.ini_options]
addopts = "--strict-markers --verbose -m 'not e2e and not integration'"
markers = [
    "e2e: marks tests as being end-to-end tests",
    "integration: marks tests as being integration tests",
]
